<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <title>IFRI_MentorLink — Onboarding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            base: '#0A0A0F',
            surface: '#14141D',
            elevated: '#1E1E2A',
            primary: '#00E5A0',
            muted: '#A0A0B0',
            borderSubtle: '#262636'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="bg-base text-white font-sans antialiased min-h-screen overflow-auto">
  <main class="h-full flex flex-col">
    <header class="p-6 pb-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded bg-primary flex items-center justify-center font-bold">M</div>
          <span class="font-bold">Mentor<span class="text-primary">Link</span></span>
        </div>
        <div class="text-sm text-muted">Étape 3 sur 5 · 60%</div>
      </div>
      <div class="mt-4 h-1.5 bg-borderSubtle rounded-full overflow-hidden">
        <div class="h-full bg-primary" style="width:60%;"></div>
      </div>
    </header>

    <section class="flex-1 p-6 md:p-0">
      <div class="mx-auto w-full max-w-[680px] py-6">
        <h2 class="text-2xl font-bold">Quelles sont vos compétences majeures ?</h2>
        <p class="text-sm text-muted mt-2">Sélectionnez les matières où vous vous sentez capable d'accompagner un autre étudiant.</p>

        <div class="mt-5">
          <input class="input" placeholder="Rechercher une compétence académique..." />
        </div>

        <div class="mt-6">
          <p class="text-sm text-muted mb-3 font-medium">COMPÉTENCES RECOMMANDÉES</p>
          <div class="flex flex-wrap gap-2">
            <button class="badge">Algorithmique I (L1)</button>
            <button class="badge">Base de Données SQL</button>
            <button class="badge">Réseaux Cisco</button>
            <button class="badge">Architecture PC</button>
            <button class="badge">Programmation C</button>
            <button class="badge">Algèbre Relationnelle</button>
            <button class="badge">Web Dev / HTML / CSS</button>
          </div>
        </div>

        <div class="mt-6">
          <p class="text-sm text-muted mb-2 font-medium">VOTRE SÉLECTION</p>
          <div class="flex flex-wrap gap-2">
            <span class="badge" style="border-color: rgba(0,229,160,0.35); background: rgba(0,229,160,0.1); color: var(--primary);">Algorithmique I (L1) ×</span>
            <span class="badge">Base de Données SQL ×</span>
          </div>
        </div>

        <div class="mt-8 flex items-center justify-between gap-4">
          <a href="./auth.html" class="btn btn-secondary">Retour</a>
          <a href="./dashboard.html" class="btn btn-primary">Continuer l'inscription</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
